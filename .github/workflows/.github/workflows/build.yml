
name: Build 0delay

on:
  workflow_dispatch:
  push:
    paths:
      - 'Odelay-fabric-project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract project
        run: |
          mkdir project
          unzip -q Odelay-fabric-project.zip -d project

      - name: Build mod
        run: |
          chmod +x $(find project -name gradlew -type f | head -1) 2>/dev/null || true
          WRAPPER=$(find project -name gradlew -type f | head -1)
          if [ -n "$WRAPPER" ]; then
            cd "$(dirname "$WRAPPER")"
            ./gradlew build
          else
            BUILD=$(find project -name build.gradle -o -name build.gradle.kts | head -1)
            cd "$(dirname "$BUILD")"
            gradle build
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: 0delay-jar
          path: project/**/build/libs/*.jar
          if-no-files-found: error
